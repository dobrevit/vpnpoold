name: ci

on:
  push:
  pull_request:
  # Callable so the release workflow runs exactly these checks rather than a
  # second copy of them that could drift.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Script syntax
        run: |
          find deploy test -type f -name '*.sh' -exec sh -n {} +
          python3 - <<'PY'
          import ast
          import pathlib
          for path in pathlib.Path("test").rglob("*.py"):
              ast.parse(path.read_text(), filename=str(path))
          PY
      - name: Unit tests
        run: go test ./...
      - name: Race tests
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Reachable vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...
      - name: Build
        run: make build
      - name: Install layout smoke test
        run: |
          destination="$(mktemp -d)"
          DESTDIR="$destination" ./deploy/install.sh ./vpnpoold
          test -x "$destination/usr/local/sbin/vpnpoold"
          test -f "$destination/etc/systemd/system/vpnpoold.service"
          # The manual install keeps /usr/local/sbin; the packaged unit must
          # not leak into it.
          grep -q '^ExecStart=/usr/local/sbin/vpnpoold daemon' \
            "$destination/etc/systemd/system/vpnpoold.service"
      - name: Release archives
        run: SOURCE_DATE_EPOCH=1704067200 ./deploy/package.sh 0.0.0-ci ./dist
      - name: Native packages
        run: SOURCE_DATE_EPOCH=1704067200 ./deploy/package-native.sh 0.0.0-ci ./dist
      - name: Packages are reproducible
        run: |
          set -eu
          # Build the second copy outside the working tree. A scratch directory
          # inside the repository would show up as an untracked file, and Go
          # records that as vcs.modified in the binary it builds — so the check
          # would be measuring its own side effect rather than the packages.
          repeat="$(mktemp -d)"
          trap 'rm -rf "$repeat"' EXIT
          SOURCE_DATE_EPOCH=1704067200 ./deploy/package-native.sh 0.0.0-ci "$repeat"
          for package in ./dist/vpnpoold*.deb ./dist/vpnpoold*.rpm ./dist/vpnpoold*.apk; do
            name="$(basename "$package")"
            if [ ! -f "$repeat/$name" ]; then
              echo "second build did not produce $name" >&2
              exit 1
            fi
            first="$(sha256sum "$package" | cut -d' ' -f1)"
            second="$(sha256sum "$repeat/$name" | cut -d' ' -f1)"
            if [ "$first" != "$second" ]; then
              echo "package $name is not reproducible" >&2
              echo "  first  $first ($(stat -c '%s' "$package") bytes)" >&2
              echo "  second $second ($(stat -c '%s' "$repeat/$name") bytes)" >&2
              # Name the differing member so the log explains itself.
              case "$name" in
              *.deb)
                dpkg-deb -c "$package" >/tmp/first.list
                dpkg-deb -c "$repeat/$name" >/tmp/second.list
                diff /tmp/first.list /tmp/second.list >&2 || true
                ;;
              esac
              exit 1
            fi
          done
          echo "all packages reproduced byte-for-byte"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-release-smoke
          path: dist/

  # Install each package format in its own distribution container. The
  # directory modes asserted here are load-bearing: configuration validation
  # refuses profiles in a group- or other-writable directory, so a package that
  # ships /etc/vpnpoold as 0755 yields a daemon that will not start, and that
  # failure would otherwise surface only on an operator's host.
  #
  # Injection safety: the only values reaching a shell are matrix constants
  # defined in this file, and they are passed through `env:` rather than
  # interpolated into `run:`. No `${{ }}` expression appears inside any script
  # below, and no event payload field is read anywhere in this workflow.
  packages:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Installed through each distribution's package manager rather than a
          # low-level --nodeps install, so the per-format dependency names are
          # verified to actually resolve: rpm needs "iproute" where deb and apk
          # need "iproute2".
          - format: deb
            image: debian:12
            update: apt-get update -qq
            install: apt-get install -y --no-install-recommends
          - format: rpm
            image: fedora:40
            update: "true"
            install: dnf install -y
          - format: apk
            image: alpine:3.20
            update: apk update
            install: apk add --allow-untrusted
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-release-smoke
          path: dist
      - name: Install and verify
        env:
          IMAGE: ${{ matrix.image }}
          FORMAT: ${{ matrix.format }}
          UPDATE: ${{ matrix.update }}
          INSTALL: ${{ matrix.install }}
        run: |
          cat > verify.sh <<'SCRIPT'
          set -eu
          package="$(ls /packages/vpnpoold*."$FORMAT" | grep -E 'amd64|x86_64' | head -1)"
          echo "installing $package"
          $UPDATE >/dev/null
          $INSTALL "$package"

          test -x /usr/sbin/vpnpoold
          /usr/sbin/vpnpoold version
          test -f /usr/lib/systemd/system/vpnpoold.service
          grep -q '^ExecStart=/usr/sbin/vpnpoold daemon' \
            /usr/lib/systemd/system/vpnpoold.service
          test -f /usr/lib/tmpfiles.d/vpnpoold.conf
          test -f /usr/share/bash-completion/completions/vpnpoold

          # The unit must be installed but never enabled by a scriptlet.
          if [ -e /etc/systemd/system/multi-user.target.wants/vpnpoold.service ]; then
            echo "package enabled the service; it must stay inert" >&2
            exit 1
          fi
          # No live configuration: the unit's ConditionPathExists keeps the
          # service from starting until the operator writes one.
          if [ -e /etc/vpnpoold/vpnpoold.yaml ]; then
            echo "package shipped a live configuration file" >&2
            exit 1
          fi
          test -f /etc/vpnpoold/vpnpoold.yaml.example

          check_mode() {
            actual="$(stat -c '%a' "$1")"
            if [ "$actual" != "$2" ]; then
              echo "$1 has mode $actual, want $2" >&2
              exit 1
            fi
          }
          check_mode /etc/vpnpoold 750
          check_mode /etc/vpnpoold/profiles 700
          check_mode /etc/vpnpoold/credentials 700
          check_mode /etc/netns 755

          echo "$FORMAT package layout verified"
          SCRIPT
          docker run --rm \
            -v "$PWD/dist:/packages:ro" \
            -v "$PWD/verify.sh:/verify.sh:ro" \
            -e FORMAT -e UPDATE -e INSTALL \
            "$IMAGE" sh /verify.sh
