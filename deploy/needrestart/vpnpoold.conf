# Exclude vpnpoold from needrestart's automatic service restart.
#
# On Debian and Ubuntu, needrestart restarts any service whose binary changed
# during a package operation. For this daemon that tears down every tunnel and
# terminates every established client session, so it must stay an operator
# decision rather than a side effect of `apt upgrade`. The package's postinstall
# prints the restart instruction instead.
$nrconf{override_rc}{qr(^vpnpoold\.service$)} = 0;
