#!/usr/sbin/nft -f

flush ruleset

table inet vpnpoold_test_server {
	chain forward {
		type filter hook forward priority filter; policy drop;
		iifname "tun0" oifname "@UPLINK@" accept
		iifname "@UPLINK@" oifname "tun0" ct state established,related accept
	}
}

table ip vpnpoold_test_server_nat {
	chain postrouting {
		type nat hook postrouting priority srcnat; policy accept;
		ip saddr 10.250.0.0/24 oifname "@UPLINK@" masquerade
	}
}
