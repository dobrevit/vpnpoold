port 1194
proto udp
dev tun
topology subnet

ca /etc/openvpn/server/pki/ca.crt
cert /etc/openvpn/server/pki/issued/server.crt
key /etc/openvpn/server/pki/private/server.key
dh /etc/openvpn/server/pki/dh.pem
tls-crypt /etc/openvpn/server/tls-crypt.key

server 10.250.0.0 255.255.255.0
client-config-dir /etc/openvpn/server/ccd
ccd-exclusive
username-as-common-name
ifconfig-pool-persist /var/lib/openvpn/server/ipp.txt

script-security 2
tmp-dir /dev/shm
auth-user-pass-verify /etc/openvpn/server/check-auth.py via-file
verify-client-cert require

push "redirect-gateway def1"
push "dhcp-option DNS 1.1.1.1"

data-ciphers AES-256-GCM:AES-128-GCM
data-ciphers-fallback AES-256-GCM
auth SHA256
tls-version-min 1.2

# Keep dead UDP sessions short so repeated acceptance cycles do not leave
# misleadingly active entries in the server status file.
keepalive 5 15
persist-key
persist-tun
explicit-exit-notify 1
status /run/openvpn-server/server.status 5
status-version 3
verb 3
